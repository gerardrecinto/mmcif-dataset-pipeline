[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcifds"
version = "0.1.0"
description = "mmCIF files to resumable per-chain JSONL records, split across SLURM or Kubernetes tasks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gerard Louis Recinto" }]
dependencies = []

[project.scripts]
mmcifds = "mmcifds.__main__:main"

[tool.setuptools]
packages = ["mmcifds"]
