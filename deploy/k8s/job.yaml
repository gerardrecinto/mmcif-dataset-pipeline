# Indexed Job: one pod per shard. Set completions, parallelism and NUM_SHARDS to the same number.
# Mount your data at /data. Reapplying after a failure resumes; finished files are skipped.
apiVersion: batch/v1
kind: Job
metadata:
  name: mmcifds-build
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimitPerIndex: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: build
          # Build the Dockerfile at the repo root, push it to your registry, and put that tag here
          # (a private registry also needs imagePullSecrets under the pod spec). The stock python
          # image does not contain this package.
          image: registry.example.com/mmcifds:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          command: ["python3", "-m", "mmcifds", "build", "/data/cif", "/data/out"]
          env:
            - {name: NUM_SHARDS, value: "8"}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mmcif-data}
