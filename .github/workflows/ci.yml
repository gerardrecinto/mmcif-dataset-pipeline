name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: End to end on the sample entry, then rerun to prove resume
        run: |
          mkdir in && cp tests/data/1CRN.cif in/
          python -m mmcifds build in out
          python -m mmcifds build in out | grep '"skipped": 1'
          python -m mmcifds stats out
